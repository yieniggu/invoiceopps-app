# Production stack for a single Docker host behind a TLS-terminating tunnel.
# Nothing here publishes a host port: the only entry point is the `web`
# service, reachable as `invoiceops-web:80` from the external `edge` network
# (where the tunnel connector lives). See DEPLOY.md.
name: invoiceops

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoiceops}
      POSTGRES_DB: ${POSTGRES_DB:-invoiceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Read only by the init script on the first start of an empty volume.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-invoiceops_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    healthcheck:
      # TCP on purpose: during first-start initialisation the temporary server
      # answers on the unix socket only, and clients must not see it as ready.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [db]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    platform: linux/amd64
    image: invoiceops-backend:${INVOICEOPS_VERSION:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-invoiceops_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@db:5432/${POSTGRES_DB:-invoiceops}?schema=public
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      # nginx (`web`) is the only proxy in front of the backend.
      AUTH_TRUST_PROXY_HOPS: "1"
      # Browser-facing origin checked on cookie writes (TLS ends upstream).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://invoiceops.aglai.dev}
      # Service credential of POST /internal/api-tokens/introspect (MLflow
      # gateway). Empty: the endpoint refuses every request. Set but weak
      # (shorter than 32 characters, with whitespace, or not random-looking):
      # the backend refuses to start.
      INTERNAL_INTROSPECTION_SECRET: ${INTERNAL_INTROSPECTION_SECRET:-}
      # The session cookie is always host-only (there is no setting for a parent
      # domain): MLflow sign-in is a redirect handoff, not a shared cookie.
      # The three service secrets below must each be random and DIFFERENT from
      # one another (the backend refuses to start otherwise).
      # Models section (MLOPS-05). All empty: the section's endpoints answer 503
      # and nothing else changes. URLs are internal (compose network) except
      # MLFLOW_PUBLIC_URL, the browser-facing MLflow origin (for example
      # https://mlflow-invoiceops.aglai.dev; no path, https in production): it is
      # also the only redirect_uri host of GET /api/v1/mlflow/authorize (callback
      # <origin>/_gateway/callback). Empty: that endpoint answers 503. Secrets are >= 32
      # characters; each URL needs its secret and vice versa.
      MODEL_API_URL: ${MODEL_API_URL:-}
      MODEL_API_SERVICE_TOKEN: ${MODEL_API_SERVICE_TOKEN:-}
      MLFLOW_GATEWAY_INTERNAL_URL: ${MLFLOW_GATEWAY_INTERNAL_URL:-}
      GATEWAY_SERVICE_READ_TOKEN: ${GATEWAY_SERVICE_READ_TOKEN:-}
      MLFLOW_PUBLIC_URL: ${MLFLOW_PUBLIC_URL:-}
      MODEL_DEPLOYMENT_MAX_ACTIVE_PER_SCOPE: ${MODEL_DEPLOYMENT_MAX_ACTIVE_PER_SCOPE:-3}
      MODEL_DEPLOY_CHECK_MAX_PER_HOUR: ${MODEL_DEPLOY_CHECK_MAX_PER_HOUR:-10}
      # Automatic invoice predictions (MLOPS-06). The worker runs inside the
      # backend process and only starts when MODEL_API_URL is configured.
      # PREDICTION_WORKER_DISABLED=true turns it off (jobs stay PENDING).
      PREDICTION_WORKER_DISABLED: ${PREDICTION_WORKER_DISABLED:-false}
      PREDICTION_WORKER_POLL_MS: ${PREDICTION_WORKER_POLL_MS:-2000}
      PREDICTION_MAX_ATTEMPTS: ${PREDICTION_MAX_ATTEMPTS:-5}
      PREDICTION_CONCURRENCY: ${PREDICTION_CONCURRENCY:-4}
      PREDICTION_BATCH_SIZE: ${PREDICTION_BATCH_SIZE:-10}
      PREDICTION_RETRY_BASE_MS: ${PREDICTION_RETRY_BASE_MS:-5000}
      # An unavailable Model API costs no attempt: the job waits with a capped
      # backoff and only fails past its maximum age (24 h by default).
      PREDICTION_RETRY_MAX_MS: ${PREDICTION_RETRY_MAX_MS:-900000}
      PREDICTION_MAX_JOB_AGE_MS: ${PREDICTION_MAX_JOB_AGE_MS:-86400000}
      # Queue gauge in the log (prediction.queue) and the FAILED spike warning.
      PREDICTION_METRICS_INTERVAL_MS: ${PREDICTION_METRICS_INTERVAL_MS:-60000}
      PREDICTION_FAILED_WARN_THRESHOLD: ${PREDICTION_FAILED_WARN_THRESHOLD:-10}
      PREDICTION_FAILED_WINDOW_MS: ${PREDICTION_FAILED_WINDOW_MS:-900000}
      # Period of the models maintenance task (stale CHECKING rows, quarantines,
      # orphan and switched-off models).
      MODELS_RECONCILE_INTERVAL_MS: ${MODELS_RECONCILE_INTERVAL_MS:-30000}
    networks:
      api:
        aliases: [invoiceops-backend]
      db:
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    # `docker stop` sends SIGTERM and waits this long before SIGKILL. The
    # backend's own hard deadline is SHUTDOWN_DEADLINE_MS (10 s, src/server.ts):
    # keep this value above it so the process exits by itself and releases its
    # database pool and prediction claims.
    stop_grace_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    platform: linux/amd64
    image: invoiceops-web:${INVOICEOPS_VERSION:-latest}
    networks:
      api:
      edge:
        aliases: [invoiceops-web]
    depends_on:
      backend:
        condition: service_healthy
        # nginx resolves invoiceops-backend once at startup: restart web
        # whenever the backend container is recreated.
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # One-shot: applies pending Prisma migrations (idempotent). Uses the owner
  # role; the app itself connects as the unprivileged POSTGRES_APP_USER.
  migrate:
    profiles: [ops]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: tooling
    platform: linux/amd64
    image: invoiceops-backend-tooling:${INVOICEOPS_VERSION:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-invoiceops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-invoiceops}?schema=public
    networks: [db]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot interactive: creates the first platform administrator. The CLI
  # only accepts a loopback database, so it shares the db network namespace
  # and reaches PostgreSQL on 127.0.0.1 without publishing anything.
  bootstrap:
    profiles: [ops]
    image: invoiceops-backend:${INVOICEOPS_VERSION:-latest}
    pull_policy: never
    platform: linux/amd64
    network_mode: "service:db"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-invoiceops_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@127.0.0.1:5432/${POSTGRES_DB:-invoiceops}?schema=public
    stdin_open: true
    tty: true
    command: ["node", "dist/recovery-bootstrap.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

networks:
  api:
    name: invoiceops_api
  db:
    name: invoiceops_db
    internal: true
  edge:
    external: true
    name: ${INVOICEOPS_EDGE_NETWORK:-aglai_edge}

volumes:
  postgres_data:
    name: invoiceops_postgres_data
