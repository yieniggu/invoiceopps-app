services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoiceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-invoiceops}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoiceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-local-password}
      POSTGRES_DB: invoiceops_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d invoiceops_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "${POSTGRES_TEST_PORT:-5436}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-invoiceops}:${POSTGRES_PASSWORD:-replace-with-a-local-password}@db:5432/${POSTGRES_DB:-invoiceops}?schema=public
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-invoiceops}:${POSTGRES_PASSWORD:-replace-with-a-local-password}@db-test:5432/invoiceops_test?schema=public
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
  postgres_test_data:
