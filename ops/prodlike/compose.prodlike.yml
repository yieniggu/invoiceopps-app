# Overlay for compose.production.yml that simulates the real edge locally:
# `edge-sim` plays cloudflared + Cloudflare (TLS, CF-Connecting-IP overwrite),
# `hostile-peer` plays another container on the shared edge network.
# Used only by ops/prodlike/run.sh; never deploy this file.
#
# run.sh exports PRODLIKE_DIR (throwaway cert + edge.conf) and an env file with
# PUBLIC_ORIGIN=https://localhost:<port>.
services:
  # Production images target linux/amd64 (the real server). Set
  # PRODLIKE_PLATFORM=linux/arm64 to rule out QEMU emulation as a cause.
  backend:
    platform: ${PRODLIKE_PLATFORM:-linux/amd64}
  web:
    platform: ${PRODLIKE_PLATFORM:-linux/amd64}
  migrate:
    platform: ${PRODLIKE_PLATFORM:-linux/amd64}
  bootstrap:
    platform: ${PRODLIKE_PLATFORM:-linux/amd64}

  edge-sim:
    image: nginx:1.30.6-alpine
    volumes:
      - ${PRODLIKE_DIR:?run via ops/prodlike/run.sh}/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PRODLIKE_DIR}/tls:/etc/nginx/tls:ro
    ports:
      - "127.0.0.1:${PRODLIKE_HTTPS_PORT:-8443}:443"
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy

  hostile-peer:
    image: node:24-alpine
    command: ["sleep", "86400"]
    init: true
    networks: [edge]

# Isolate everything from the real names used in production.
networks:
  api:
    name: invoiceops-prodlike_api
  db:
    name: invoiceops-prodlike_db
volumes:
  postgres_data:
    name: invoiceops-prodlike_postgres_data
