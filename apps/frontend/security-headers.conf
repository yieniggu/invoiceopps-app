# Included at server level and again in every location that sets its own
# add_header: nginx discards inherited add_header directives as soon as a
# location declares one. `always` also covers 4xx/5xx responses.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# Ignored by browsers over plain http, so local (http) routes are unaffected.
add_header Strict-Transport-Security "max-age=31536000" always;
