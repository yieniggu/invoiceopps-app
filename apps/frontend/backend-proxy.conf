# Shared by every location that proxies to the backend (/api/, the deployments
# regex, /openapi.json and /docs): one definition so the hop headers cannot
# drift between them. `proxy_pass` stays in each location (it differs by
# purpose and the /internal contract test reads it there).
#
# Host is forwarded with its port ($http_host, never $host): without
# PUBLIC_ORIGIN (local route) the backend compares Origin with Host.
# X-Forwarded-For is overwritten (never appended) so the backend sees exactly
# one trusted hop and a client-supplied chain cannot influence request.ip.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header CF-Connecting-IP "";
