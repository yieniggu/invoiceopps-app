<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma académica InvoiceOps" />
    <meta name="color-scheme" content="light dark" />
    <title>InvoiceOps</title>
    <script>
      // Sets the theme before first paint (no flash). Keep in sync with
      // src/lib/theme.ts; covered by src/theme-bootstrap.ui.test.ts.
      (function () {
        var theme = null;
        try {
          var stored = window.localStorage.getItem("invoiceops.theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) {}
        if (!theme) {
          try {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } catch (e) {
            theme = "light";
          }
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
