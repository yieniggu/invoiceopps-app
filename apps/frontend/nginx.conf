server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Real client address. In production nginx publishes no host port, so only
  # containers on the docker networks it joins (private ranges) can reach it,
  # and the tunnel in front (Cloudflare) overwrites CF-Connecting-IP, so an
  # internet client cannot forge it. Residual risk, ACCEPTED (ticket DEP-04,
  # 2026-10-30): an operator-owned container on the shared edge network could
  # still send a forged header and pick its own rate-limit identity.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from fc00::/7;
  real_ip_header CF-Connecting-IP;

  # Liveness for the container healthcheck; never reaches the backend.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Without this, `GET /api` falls to the SPA location, which answers a 301 to
  # `/api/` and would then proxy a path no route serves.
  location = /api {
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Route not found"}}';
  }

  # The hop headers (Host, X-Forwarded-For/-Proto, CF-Connecting-IP) live in
  # the shared backend-proxy.conf snippet, see there.
  # The upstream name is project-specific: on a shared docker network another
  # project's container may own the generic DNS name `backend`.
  location /api/ {
    proxy_pass http://invoiceops-backend:3000;
    include /etc/nginx/snippets/backend-proxy.conf;
  }

  # Deploying a model runs the official gate synchronously and may take up to
  # 120 s in the backend, and a PATCH of a deployment may reload the model
  # (CR-588). The default read timeout (60 s) would cut the request with a 504
  # while the backend still finishes it, so these routes wait a little longer
  # than the backend: the list/deploy `/api/v1/deployments` and one deployment
  # `/api/v1/deployments/<id>` (exactly one segment; nothing deeper, no trailing
  # slash). Everything else under /api/ keeps the default. The query string does
  # not take part in the path match, so the list read shares the limit (it is
  # fast anyway). The `/internal` routes are never proxied and never match here.
  #
  # Behind the Cloudflare tunnel the edge, not nginx, may cut first: its proxy
  # read timeout is ~100 s (HTTP 524, an HTML body), shorter than this limit
  # and than the backend's 120 s. The deploy then keeps running in the backend
  # while the browser gets a 524. The frontend reads 524 like 504 («Sin
  # respuesta del servicio») and refreshes the deployments list, which says
  # what really happened (CR-582).
  location ~ ^/api/v1/deployments(/[^/]+)?$ {
    proxy_pass http://invoiceops-backend:3000;
    proxy_read_timeout 130s;
    include /etc/nginx/snippets/backend-proxy.conf;
  }

  location = /openapi.json {
    proxy_pass http://invoiceops-backend:3000;
    include /etc/nginx/snippets/backend-proxy.conf;
  }

  # Swagger UI (public, served by the backend). Exact `/docs` and the `/docs/`
  # prefix only, so `/docsx` still falls to the SPA. The security headers come
  # from the server-level include.
  location = /docs {
    proxy_pass http://invoiceops-backend:3000;
    include /etc/nginx/snippets/backend-proxy.conf;
  }

  location /docs/ {
    proxy_pass http://invoiceops-backend:3000;
    include /etc/nginx/snippets/backend-proxy.conf;
  }

  # Vite emits content-hashed file names under /assets/, so they never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback. index.html names the current hashed assets, so it must be
  # revalidated on every load.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
