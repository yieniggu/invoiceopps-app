server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Real client address. In production nginx publishes no host port, so only
  # containers on the docker networks it joins (private ranges) can reach it,
  # and the tunnel in front (Cloudflare) overwrites CF-Connecting-IP, so an
  # internet client cannot forge it. Residual risk, ACCEPTED (ticket DEP-04,
  # 2026-10-30): an operator-owned container on the shared edge network could
  # still send a forged header and pick its own rate-limit identity.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from fc00::/7;
  real_ip_header CF-Connecting-IP;

  # Liveness for the container healthcheck; never reaches the backend.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Without this, `GET /api` falls to the SPA location, which answers a 301 to
  # `/api/` and would then proxy a path no route serves.
  location = /api {
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Route not found"}}';
  }

  # Host is forwarded with its port ($http_host, never $host): without
  # PUBLIC_ORIGIN (local route) the backend compares Origin with Host.
  # The upstream name is project-specific: on a shared docker network another
  # project's container may own the generic DNS name `backend`.
  # X-Forwarded-For is overwritten (never appended) so the backend sees exactly
  # one trusted hop and a client-supplied chain cannot influence request.ip.
  location /api/ {
    proxy_pass http://invoiceops-backend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
  }

  location = /openapi.json {
    proxy_pass http://invoiceops-backend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
  }

  # Vite emits content-hashed file names under /assets/, so they never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback. index.html names the current hashed assets, so it must be
  # revalidated on every load.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
